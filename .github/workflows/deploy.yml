name: Publicare Aplicatie Voyago pe GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./aplicatia-mea
    steps:
      - name: Descarca codul sursa
        uses: actions/checkout@v4
      - name: Configureaza mediul Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Instaleaza pachetele proiectului
        run: npm install
      - name: Construieste versiunea finala
        run: npm run build
      - name: Incarca fisierele rezultate pentru publicare
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./aplicatia-mea/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Publica aplicatia pe GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
